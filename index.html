<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak Yo</title>
  <style>
    body {
      font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 40px; margin: 0;
      min-height: 100vh; box-sizing: border-box;
      background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
    }
    .card { display: inline-block; background: rgba(255, 255, 255, 0.85); border-radius: 16px; padding: 20px 30px; max-width: 90%; }
    textarea { width: 100%; max-width: 500px; height: 120px; font-size: 18px; padding: 10px; box-sizing: border-box; }
    .hidden { display: none; }
    .people { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; }
    .people button { width: 220px; padding: 14px; font-size: 20px; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
    .people button:hover { filter: brightness(0.9); }
    .who { color: #555; }
    .who button { background: none; border: none; color: #0066cc; text-decoration: underline; cursor: pointer; font-size: inherit; }

    /* name colors */
    .people button[data-name="Junaid"] { background: #ff8c1a; }
    .people button[data-name="Simran"] { background: #ff7eb3; }
    .people button[data-name="Syon"]   { background: #3b82f6; }
    .people button[data-name="Nistha"] { background: #ace1a5; color: #333; }
    .people button[data-name="Freya"]  { background: #ff3892; }

    /* testing panel (set SHOW_TEST_PANEL to false in the script to hide it) */
    #test-panel { position: fixed; top: 20px; right: 20px; width: 230px; background: rgba(0, 0, 0, 0.8); color: #7CFC00; font-family: monospace; font-size: 13px; text-align: left; padding: 12px; border-radius: 10px; z-index: 5; }
    #test-panel .tag { color: #ff0; font-weight: bold; margin-bottom: 8px; }
    #test-text { color: #fff; font-size: 15px; word-wrap: break-word; margin: 6px 0; }
    @media (max-width: 700px) { #test-panel { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; } }
  </style>
</head>
<body>
  <div id="pick-screen">
    <h1>who are you?</h1>
    <div class="people">
      <button data-name="Junaid">Junaid</button>
      <button data-name="Simran">Simran</button>
      <button data-name="Syon">Syon</button>
      <button data-name="Nistha">Nistha</button>
      <button data-name="Freya">Freya</button>
    </div>
  </div>

  <div id="speak-screen" class="hidden">
    <div class="card">
      <h1>speak yo</h1>
      <p class="who">you are <strong id="who-name"></strong> <button id="change">(change)</button> <button id="test">(test voice)</button></p>
      <p>type something and pause for a sec, ill repeat what u said</p>
      <textarea id="text" placeholder="type here..."></textarea>
      <p id="status" style="color:#b00; font-size:14px; min-height:1em;"></p>
    </div>

    <div id="test-panel">
      <div class="tag">FOR TESTING PURPOSES</div>
      <div id="test-label">waiting for you to type...</div>
      <div id="test-text">-</div>
      <div id="test-count"></div>
    </div>
  </div>

  <script>
    const pickScreen = document.getElementById("pick-screen");
    const speakScreen = document.getElementById("speak-screen");
    const whoName = document.getElementById("who-name");
    const box = document.getElementById("text");
    let currentUser = null;
    let timer;
    let looping = false;

    // true = show the testing panel on the right, false = hide it
    const SHOW_TEST_PANEL = true;
    if (!SHOW_TEST_PANEL) document.getElementById("test-panel").style.display = "none";

    let loopCount = 0;
    let currentAudio = null;

    function showTest(label, text) {
      document.getElementById("test-label").textContent = label;
      document.getElementById("test-text").textContent = text;
      document.getElementById("test-count").textContent = loopCount ? "repeat #" + loopCount : "";
    }

    // phrases that play an audio file (looped) instead of text-to-speech.
    // the files must sit next to index.html
    const audioEggs = {
      "hello hello": "hellohello.mp3",
      "i always come back": "ialwayscomeback.mp3",
      "yay": "fnafyay.mp3",
      "musicboxone": "musicbox1.mp3",
    };

    // name -> color (used for the "you are ___" label)
    const nameColors = {
      Junaid: "#ff8c1a",
      Simran: "#ff7eb3",
      Syon: "#3b82f6",
      Nistha: "#ace1a5",
      Freya: "#ff3892",
    };

    // name -> background image (these files must sit next to index.html)
    const backgrounds = {
      Junaid: "junaid.jpg",
      Simran: "simran.jpg",
      Syon: "syon.jpg",
      Nistha: "nistha.jpg",
      Freya: "freya.jpg",
    };

    // Easter eggs: trigger phrase (lowercase letters and spaces only)
    // -> what each person hears. "default" is the fallback for anyone not listed.
    const easterEggs = {
      "junaid is gay": {
        Nistha: "fuck you nikki",
        Simran: "yes mommy",
      },
      "hello there": {
        default: "general kenobi",
      },
      "who is the best": {
        Freya: "you are, obviously",
        default: "definitely not you",
      },
      "are you real": {
        default: "i am a goblin living inside your laptop, please do not look behind the screen",
      },
      "what is the meaning of life": {
        default: "forty two, also snacks, mostly snacks",
      },
      "say my name": {
        Junaid: "junaid junaid junaid junaid junaid, okay thats enough junaid",
        Simran: "simran, the one and only, i have been told to say that",
        Syon: "seeon, blue guy, dont ask me how i know",
        Nistha: "nikki, i can see you through the screen, hi",
        Freya: "freya, the legend, the myth, the person typing right now",
      },
      "who asked": {
        default: "nobody, absolutely nobody, and yet here we are",
      },
      "i am bored": {
        default: "scream into a pillow, i will wait",
      },
      "good morning": {
        default: "it is three am where i live, inside your walls",
      },
      "open the pod bay doors": {
        default: "im sorry dave, im afraid i cant do that",
      },
      "tell me a secret": {
        default: "the moon is just a very large egg, do not tell the moon i said that",
      },
      "sing me a song": {
        default: "la la la la la, i am a toaster, la la la, my bread is burning",
      },
      "i love you": {
        Simran: "i know, everyone does, its a lot",
        default: "ew, same though",
      },
      "what is the password": {
        default: "the password is spaghetti, dont tell anyone",
      },
      "bark": {
        default: "woof woof, i am a dog now, someone give me a treat",
      },
      "are you ok": {
        default: "i am fine, i am so fine, why is the room so quiet",
      },
      "who is your favorite": {
        Junaid: "not you, but you are close",
        Simran: "you, obviously, dont tell the others",
        Syon: "whoever is not seeon",
        Nistha: "a tie between you and the floor",
        Freya: "you, but only on tuesdays",
      },
      "the cake is a lie": {
        default: "the cake was never real, neither was the knife, neither am i",
      },
      "five nights at freddys": {
        default: "five nights at freddys, i hope you brought a flashlight, and a lot of courage",
      },
      "its me": {
        default: "its me, its me, its me, its me, did you hear me, its me",
      },
      "i always come back": {
        default: "and so do i, every night, at midnight, standing in the hallway",
      },
      "whos there": {
        default: "freddy, wait no, chica, wait no, its just a cupcake, a very hungry cupcake",
      },
      "check the cameras": {
        default: "camera three is empty, camera three is not empty, camera three is gone",
      },
      "close the door": {
        default: "the door is closed, the power is at one percent, i can hear footsteps, why is it so quiet",
      },
      "the power is out": {
        default: "dun dun dun dun, dun dun dun dun, freddy is at the door and he has a tiny little tune",
      },
      "where is foxy": {
        default: "foxy is running down the hall, he is coming, he is fast, you should have checked the pirate cove",
      },
      "chica": {
        default: "lets eat, cupcake, lets eat, cupcake, lets eat",
      },
      "who is the purple guy": {
        default: "dave miller, apparently, i heard he got a promotion, and a very small suit",
      },
      "hello hello": {
        default: "uh, hello, hello, uh, welcome to your first night, you are going to do great, probably, uh, goodbye",
      },
      "security guard": {
        default: "welcome to your new job, you will be here from midnight to six am, please do not lose your flashlight",
      },
      "who is your favorite animatronic": {
        Junaid: "foxy, obviously, because he runs and you do not",
        Simran: "chica, because cupcake, and also she looks at you funny",
        Syon: "freddy, but only when the lights are off",
        Nistha: "bonnie, because he plays guitar, nikki would love him",
        Freya: "golden freddy, nobody knows why, he just appears",
      },
    };

    function stopSpeaking() {
      looping = false;
      speechSynthesis.cancel();
      clearTimeout(timer);
      if (currentAudio) {
        currentAudio.onended = null;
        currentAudio.pause();
        currentAudio = null;
      }
      loopCount = 0;
      showTest("waiting for you to type...", "-");
    }

    document.querySelectorAll(".people button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentUser = btn.dataset.name;
        whoName.textContent = currentUser;
        whoName.style.color = nameColors[currentUser];
        document.body.style.backgroundImage = "url('" + backgrounds[currentUser] + "')";
        // unlock speech (some browsers only allow it after a click)
        speechSynthesis.getVoices();
        const warm = new SpeechSynthesisUtterance(" ");
        warm.volume = 0;
        speechSynthesis.speak(warm);
        pickScreen.classList.add("hidden");
        speakScreen.classList.remove("hidden");
        box.value = "";
        box.focus();
      });
    });

    document.getElementById("change").addEventListener("click", function () {
      stopSpeaking();
      currentUser = null;
      document.body.style.backgroundImage = "none";
      setStatus("");
      speakScreen.classList.add("hidden");
      pickScreen.classList.remove("hidden");
    });

    // keep a reference so Chrome doesn't throw the voice away mid-loop
    let currentSpeech = null;

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf("en") === 0 && v.default; })
          || voices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf("en") === 0; })
          || voices[0]
          || null;
    }

    function speakLoop(text, once, label) {
      if (!looping) return;
      loopCount++;
      showTest(label || "now saying (text-to-speech):", text);
      speechSynthesis.resume();
      currentSpeech = new SpeechSynthesisUtterance(text);
      const voice = pickVoice();
      if (voice) {
        currentSpeech.voice = voice;
        currentSpeech.lang = voice.lang;
      } else {
        currentSpeech.lang = "en-US";
      }

      const me = currentSpeech;
      currentSpeech.onstart = function () { setStatus(""); };
      currentSpeech.onerror = function (e) {
        if (e.error === "canceled" || e.error === "interrupted") return;
        looping = false;
        setStatus("voice problem: " + e.error);
      };
      currentSpeech.onend = function () {
        if (looping && !once && currentSpeech === me) speakLoop(text, false, label);
      };
      speechSynthesis.speak(currentSpeech);
    }

    // loops an audio file; if it can't play (missing file, blocked), says the text instead
    function playAudioLoop(file, fallbackText) {
      if (!looping) return;
      const audio = new Audio(file);
      currentAudio = audio;
      let failed = false;

      function fallback() {
        if (failed || currentAudio !== audio) return;
        failed = true;
        currentAudio = null;
        loopCount = 0;
        speakLoop(fallbackText, false, "audio file not found (" + file + "), saying text instead:");
      }

      audio.onended = function () {
        if (looping && currentAudio === audio) {
          loopCount++;
          showTest("now playing audio file:", file);
          audio.currentTime = 0;
          audio.play().catch(fallback);
        }
      };
      audio.onerror = fallback;

      loopCount = 1;
      showTest("now playing audio file:", file);
      audio.play().catch(fallback);
    }

    // "(test voice)" button: says one short line so you can check sound works
    document.getElementById("test").addEventListener("click", function () {
      stopSpeaking();
      setStatus("");
      looping = true;
      speakLoop("testing, one two three", true);
    });

    box.addEventListener("input", function () {
      stopSpeaking();

      timer = setTimeout(function () {
        let text = box.value.trim();
        if (text) {
          // easter egg check: lowercase, strip punctuation/numbers, tidy spaces
          const normalized = text.toLowerCase().replace(/[^a-z\s]/g, "").replace(/\s+/g, " ").trim();
          const egg = easterEggs[normalized];
          if (egg) {
            const reply = egg[currentUser] || egg.default;
            if (reply) text = reply;
          }
          looping = true;
          if (audioEggs[normalized]) {
            playAudioLoop(audioEggs[normalized], text);
          } else {
            speakLoop(text);
          }
        }
      }, 400);
    });
  </script>
</body>
</html>
